[build-system]
requires = ['hatchling==1.32.4', 'hatch-vcs==0.5.0']
build-backend = 'hatchling.build'

[project]
name = 'phonscope'
dynamic = ['version']
description = 'A metric of phonetic diversity and balance of textual data.'
authors = [
    { name = 'Alexandra Badasyan', email = 'sashabadasyan@icloud.com' },
]
readme = 'README.md'
requires-python = '>=3.12,<3.13'
keywords = ['nlp', 'russian', 'phonetics', 'linguistic', 'voice', 'tts', 'asr']
classifiers = [
    'Natural Language :: Russian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Topic :: Text Processing :: Linguistic',
]
dependencies = ['RuTranscript==2.2.0', 'pydantic==2.14.1']

[project.scripts]
phonscope = 'phonscope.cli:main'

[project.urls]
Repository = 'https://github.com/suralmasha/PhonScope'
Issues = 'https://github.com/suralmasha/PhonScope/issues'

[dependency-groups]
dev = ['ruff==0.15.12', 'ty==0.0.89', 'pre-commit==4.6.0']

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.targets.wheel]
packages = ['src/phonscope']

[tool.uv]
cache-keys = [{ file = 'pyproject.toml' }, { git = { commit = true, tags = true } }]

[tool.ty.environment]
python-version = '3.12'

[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['F', 'E', 'W', 'I', 'N', 'D', 'UP', 'YTT', 'ANN', 'ASYNC', 'S', 'B', 'A', 'COM', 'C4', 'ISC', 'ICN', 'LOG',
    'G', 'INP', 'PIE', 'T20', 'PYI', 'Q', 'RSE', 'RET', 'SLF', 'SIM', 'TID', 'TC', 'INT', 'ARG', 'PTH', 'PD', 'PL',
    'TRY', 'FLY', 'NPY', 'FAST', 'PERF', 'FURB', 'RUF']
ignore = ['D100', 'D104', 'COM812', 'RUF001', 'RUF002', 'RUF003']

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['S101', 'PLR2004']

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
